[raptor]
version = "1.2.1"

[raptor.paths]
docs_dir = "Docs"
tools_dir = "Tools"

[raptor.setup]
headless = false

[[raptor.setup.environment]]
name = "git"
min_version = "2.53.0"

[[raptor.setup.environment]]
name = "git-hooks"
min_version = "1.2.0"

[[raptor.setup.environment]]
name = "vulkan"
min_version = "1.4.335.0"

[raptor.doctor]
[[raptor.doctor.checks]]
name = "git"
[[raptor.doctor.checks]]
name = "git-hooks"
[[raptor.doctor.checks]]
name = "vulkan"
[[raptor.doctor.checks]]
name = "vulkan-driver"

[raptor.premake]
default_action = "vs2026"
supported_actions = ["vs2026"]

[raptor.workspace]
dir = "."
name = "VkCompute"
configs = ["Debug", "Dev", "Release"]
default_config = "Dev"
default_arch = "x64"

[raptor.workspace.executable_projects.VkCompute]
dir = "VkCompute"
language = "cpp"
arch = "x64"
build_mode = "solution"

[raptor.clean.targets.workspace]
search_dirs = [
    ".",
    "VkCompute"
]
delete_dirs = []
files = [".raptordoctor"]
file_exts = [
    ".vcxproj",
    ".vcxproj.filters",
    ".vcxproj.user",
    ".slnx"
]
depth = "shallow"

[raptor.clean.targets.bin]
search_dirs = ["."]
delete_dirs = ["bin"]
files = []
file_exts = []
depth = "shallow"

[raptor.clean.targets.int]
search_dirs = ["."]
delete_dirs = ["bin/int", "bin/intermediate", "bin/obj"]
files = []
file_exts = []
depth = "shallow"
